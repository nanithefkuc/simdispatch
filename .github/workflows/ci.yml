name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The selection tests inject host proofs for every rung. A hosted runner cannot
# establish that V4 or V4x actually ran, so there is no forced AVX-512 job.
# The scalar override does have a host-independent, observable result.
jobs:
  validate:
    name: validate and scalar override
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - run: just validate
      - run: just test
        env:
          SIMD_BACKEND: scalar

  msrv:
    name: msrv 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain name must match `MSRV` in crate.just: `just msrv` runs
      # `cargo +1.89`.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just msrv

  sve-check:
    name: pinned-nightly SVE cross-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain must match `SVE_NIGHTLY` in crate.just: `just
      # sve-check` runs `cargo +nightly-2026-09-28` against this target.
      - uses: dtolnay/rust-toolchain@nightly-2026-09-28
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just sve-check

  sve-runtime:
    name: QEMU SVE runtime correctness (VL 128/256/512)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly-2026-09-28
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install QEMU and AArch64 cross-toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-user gcc-aarch64-linux-gnu libc6-dev-arm64-cross jq
      - uses: Swatinem/rust-cache@v2
        with:
          key: sve-runtime-ubuntu-24.04
      - uses: extractions/setup-just@v2
      - name: Report emulator and cross-toolchain versions
        run: |
          qemu-aarch64 --version
          aarch64-linux-gnu-gcc --version
          dpkg-query --show qemu-user gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Execute intrinsic and backend correctness matrix
        run: just sve-runtime qemu-aarch64 /usr/aarch64-linux-gnu aarch64-linux-gnu-gcc
