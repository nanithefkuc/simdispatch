[package]
name = "simdispatch"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Runtime SIMD backend detection and downgrade-only selection, shared across SIMD-accelerated crates"
license = "MIT"
repository = "https://github.com/nanithefkuc/simdispatch"
homepage = "https://github.com/nanithefkuc/simdispatch"
readme = "README.md"
# Only library sources and public release documentation enter the package.
include = ["src/**", "/README.md", "/CHANGELOG.md", "/LICENSE"]
keywords = ["simd", "cpu-features", "dispatch", "detection", "runtime"]
categories = ["hardware-support", "no-std", "algorithms"]

[features]
default = ["std"]
# Runtime detection (archmage `summon()`) + the `SIMD_BACKEND` environment
# override + the process-wide `backend()`. Without `std`, resolution reports
# `Backend::Scalar` unconditionally.
std = []
# Enable the V4 and V4x AVX-512 tiers and their archmage capability proofs.
avx512 = ["archmage/avx512"]
# Unstable internals for benchmarking and downstream experimentation
# (`selection::internals`). Nothing behind it is a compatibility promise.
internals = []

[dependencies]
# Released upstream: 0.9.29 carries X64V3GfniCryptoToken — AVX2 + GFNI
# without AVX-512 — the token this crate's degrade ladder sits on. Pinned
# exactly: tier ordering feeds the downgrade check, so a floating range must
# not silently move the ladder under a rebuild.
archmage = "=0.9.29"
